name: Build

on:
  push:
    tags:
      - v/*
      - ci/*

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - name: Server, Windows
            project: src/Api/Api.csproj
            runtime: win-x64
            artifact: server-windows
          - name: Server, Mac
            project: src/Api/Api.csproj
            runtime: osx-arm64
            artifact: server-mac
          - name: Server, Linux
            project: src/Api/Api.csproj
            runtime: linux-x64
            artifact: server-linux
          - name: Client, Windows
            project: src/Tui/Tui.csproj
            runtime: win-x64
            artifact: client-windows
          - name: Client, Mac
            project: src/Tui/Tui.csproj
            runtime: osx-arm64
            artifact: client-mac
          - name: Client, Linux
            project: src/Tui/Tui.csproj
            runtime: linux-x64
            artifact: client-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      - name: Restore tools
        run: dotnet tool restore

      - name: Publish
        run: dotnet publish ${{ matrix.project }} --configuration Release --runtime ${{ matrix.runtime }} --self-contained false --output artifacts/${{ matrix.artifact }}

      - name: Upload artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}

  release:
    name: Draft release
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      - name: Restore tools
        run: dotnet tool restore

      - name: Build API
        run: dotnet build src/Api/Api.csproj --configuration Release

      - name: Get API assembly version
        id: version
        run: |
          assembly_version="$(sed -n 's/.*AssemblyVersionAttribute("\([^"]*\)").*/\1/p' src/Api/obj/Release/net10.0/Api.AssemblyInfo.cs)"
          test -n "$assembly_version"
          echo "assembly_version=$assembly_version" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create release assets
        if: ${{ !env.ACT }}
        run: |
          mkdir release-assets
          for artifact in release-artifacts/*; do
            if [ -d "$artifact" ]; then
              (cd "$artifact" && zip -r "$GITHUB_WORKSPACE/release-assets/$(basename "$artifact").zip" .)
            fi
          done

      - name: Create draft release
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.zip --draft --title "${{ steps.version.outputs.assembly_version }}"
